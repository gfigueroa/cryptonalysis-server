crypto: "ETH"
save_preprocessing_data: false
save_preprocessing_roi: false
save_training_results: false
save_training_model: false

preprocessing {
  "end_date": "2019-02-28",
  "normalize": true,
  "normalize_by_row": false,
  "standardize": false,
  "predictor_cls": "BiffPredictor",
  "predictor_params": {
    "daily_allowance": 5
    "lookahead_days": 1,
    "prob_buy": 1,
    "prob_sell": 1,
    "starting_investment": 100,
  },
  "price_column": "Close",
  "start_date": "2019-01-01",
  "window_size": 10
}

training {
  "cv_folds": 4
  "dev_size": 0.5,
  "shuffle_data": true,
  "training_size": 0.7,
}

deep_learning {
    neurons: 10
}

logging {
    level: "DEBUG"
    handlers: "console"
}
