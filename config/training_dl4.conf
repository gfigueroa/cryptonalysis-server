# Grid search hyperparameters
# Each configuration value can be a single values or an array of values for grid search

crypto: LTC
save_preprocessing_data: true
save_preprocessing_roi: false
save_training_results: true
save_training_model: false

preprocessing {
    start_date: ["2017-01-01", "2018-01-01"]  # YYYY-MM-DD
    end_date: "2019-09-30"  # YYYY-MM-DD, today, yesterday
    window_size: [30, 40, 50, 60]
    normalize: true
    normalize_by_row: [true, false]
    standardize: [true, false]
    price_column: "Close"
    predictor_cls: ["BiffPredictor", "BiffPredictorSmart"]
    predictor_params {
        prob_buy: 1,
        prob_sell: 1,
        starting_investment: 100,
        daily_allowance: 5,
        lookahead_days: [1, 2, 3, 4]
    }
}

training {
    shuffle_data: [true, false]
}

deep_learning {
    neurons: [80]
}

logging {
    level: "INFO"
    handlers: "console"
}
