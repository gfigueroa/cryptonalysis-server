[loggers]
keys = root

[logger_root]
level = %(logging.level)s
handlers = %(logging.handlers)s

[handlers]
keys = %(logging.handlers)s

[handler_console]
class = StreamHandler
level = %(logging.level)s
formatter = console
args = (sys.stdout,)

[formatters]
keys = console

[formatter_console]
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
class = logging.Formatter