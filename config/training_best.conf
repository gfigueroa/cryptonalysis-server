crypto: "ETH"  # BTC, XRP, LTC, USDT

preprocessing {
  "normalize": true,
  "window_size": 50,
  "predictor_params": {
    "lookahead_days": 4,
    "prob_sell": 1,
    "starting_investment": 100,
    "prob_buy": 1,
    "daily_allowance": 5
  },
  "end_date": "2019-05-04",
  "price_column": "Close",
  "normalize_by_row": false,
  "save_data": true,
  "predictor_cls": "BiffPredictor",
  "save_roi": false,
  "start_date": "2017-01-01"
}

training {
  "save_results": false,
  "save_model": true,
  "dev_size": 0.5,
  "shuffle_data": true,
  "training_size": 0.7,
  "cv_folds": 4
}

logging {
    level: "INFO"
    handlers: "console"
}
