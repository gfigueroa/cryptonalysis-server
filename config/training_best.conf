crypto: "ETH"  # BTC, XRP, LTC, USDT

preprocessing {
  "normalize": true,
  "window_size": 60,
  "predictor_params": {
    "lookahead_days": 1,
    "prob_sell": 1,
    "starting_investment": 100,
    "prob_buy": 1,
    "daily_allowance": 5
  },
  "end_date": "today",
  "price_column": "Close",
  "normalize_by_row": false,
  "save_data": true,
  "predictor_cls": "BiffPredictor",
  "save_roi": false,
  "start_date": ["2016-01-01", "2017-01-01", "2018-01-01"]
}

training {
    shuffle_data: true
    save_results: true
}

logging {
    level: "INFO"
    handlers: "console"
}
