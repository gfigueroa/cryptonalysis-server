crypto: "ETH"  # BTC, XRP, LTC, USDT

# Grid search hyperparameters
training {
    shuffle_data: [true, false]
    preprocessing: {  # Default values in preprocessing config
        window_size: [10, 20, 30, 40, 50, 60]
        normalize_by_row: [true, false]
        save_roi: false
        save_data: true
        predictor_cls: "BiffPredictorSmart"
        predictor_params {
            prob_buy: 1,
            prob_sell: 1,
            starting_investment: 100,
            daily_allowance: 5,
            lookahead_days: 4
        }
    }
}

logging {
    level: "INFO"
    handlers: "console"
}
